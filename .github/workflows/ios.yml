name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'game/assets/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile iPhone arm64 app and package unsigned IPA
        run: bash ios/build.sh
      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunnyWorld-iOS-unsigned
          path: |
            downloads/FunnyWorld-0.1-unsigned.ipa
            downloads/FunnyWorld-0.1-unsigned.ipa.sha256
          if-no-files-found: error
      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-0.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --target "$GITHUB_SHA" \
            --title 'Funny World iOS 0.1 — unsigned IPA' \
            --notes 'iOS 15+. Unsigned arm64 device build. Requires Apple signing/provisioning before installation. Not an App Store or TestFlight build. Gameplay and device installation have not been tested on a physical iPhone.' \
            downloads/FunnyWorld-0.1-unsigned.ipa \
            downloads/FunnyWorld-0.1-unsigned.ipa.sha256
